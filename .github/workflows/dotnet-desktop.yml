name: WinForms SQLite build
on:
  pull_request:
  push:
    branches: [main, feature/winforms-sqlite-lookups]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WinForms application
        run: dotnet build web_links_ORB.csproj --configuration Release
      - name: Test SQLite data layer
        run: dotnet test ORB.Data.Tests/ORB.Data.Tests.csproj --configuration Release
      - name: Generate fictional SQLite database
        run: dotnet run --project ORB.Data.Demo/ORB.Data.Demo.csproj --configuration Release -- "${{ runner.temp }}/orb-ui-demo.db"
      - name: Exercise WinForms state, county, resource and details bindings
        run: dotnet run --project web_links_ORB.csproj --configuration Release --no-build -- --smoke-test "${{ runner.temp }}/orb-ui-demo.db"
