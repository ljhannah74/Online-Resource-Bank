name: WinForms SQLite build
on:
  pull_request:
  push:
    branches: [main, feature/restore-original-orb-layout]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Visual Studio solution in Debug and Release
        run: |
          dotnet build web_links_ORB.sln --configuration Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build web_links_ORB.sln --configuration Release
      - name: Test SQLite data layer
        run: dotnet test ORB.Data.Tests/ORB.Data.Tests.csproj --configuration Release
      - name: Generate fictional SQLite database
        run: dotnet run --project ORB.Data.Demo/ORB.Data.Demo.csproj --configuration Release -- "${{ runner.temp }}/orb-ui-demo.db"
      - name: Exercise WinForms state, county, resource and details bindings
        run: dotnet run --project web_links_ORB.csproj --configuration Release --no-build -- --smoke-test "${{ runner.temp }}/orb-ui-demo.db"
      - name: Preserve original form screenshot
        uses: actions/upload-artifact@v4
        with:
          name: original-orb-screen
          path: ${{ runner.temp }}/orb-original-smoke.png
          if-no-files-found: error
